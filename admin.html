<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4c1d95">
  <title>CharmCraft — Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="admin-login" class="admin-login active">
    <div class="login-card">
      <div class="login-logo">💜</div>
      <h1 class="login-title">CharmCraft Admin</h1>
      <p class="login-subtitle">🔐 Secure Access</p>
      <div class="login-form">
        <label class="admin-label" for="admin-username">Username</label>
        <input type="text" class="admin-input" id="admin-username" placeholder="admin">
        <label class="admin-label" for="admin-password">Password</label>
        <input type="password" class="admin-input" id="admin-password" placeholder="••••••••">
        <label class="admin-check"><input type="checkbox" id="admin-remember"> Remember me</label>
        <button type="button" class="admin-btn-primary" id="btn-admin-login">Sign In</button>
        <p class="login-error" id="login-error"></p>
      </div>
    </div>
  </div>

  <!-- MAIN DASHBOARD (hidden until login) -->
  <div id="admin-app" class="admin-app">
    <!-- Top Bar -->
    <header class="admin-topbar">
      <button type="button" class="admin-menu-toggle" id="btn-menu-toggle" aria-label="Toggle menu">☰</button>
      <h1 class="admin-topbar-title">Admin</h1>
      <div class="admin-topbar-right">
        <span class="admin-topbar-role" id="admin-role-badge">Super Admin</span>
        <button type="button" class="admin-btn-sm" id="btn-admin-logout">Logout</button>
      </div>
    </header>

    <div class="admin-layout">
      <!-- Sidebar -->
      <nav class="admin-sidebar" id="admin-sidebar">
        <a href="#dashboard" class="admin-nav-item active" data-page="dashboard">📊 Dashboard</a>
        <a href="#users" class="admin-nav-item" data-page="users">👥 Users</a>
        <a href="#coach-victor" class="admin-nav-item" data-page="coach-victor">🧠 Coach Victor</a>
        <a href="#content" class="admin-nav-item" data-page="content">📝 Content</a>
        <a href="#achievements" class="admin-nav-item" data-page="achievements">🏆 Achievements</a>
        <a href="#missions" class="admin-nav-item" data-page="missions">🎯 Missions</a>
        <a href="#practice" class="admin-nav-item" data-page="practice">🎭 Practice</a>
        <a href="#insights-admin" class="admin-nav-item" data-page="insights-admin">📊 Insights</a>
        <a href="#notifications" class="admin-nav-item" data-page="notifications">🔔 Notifications</a>
        <a href="#analytics" class="admin-nav-item" data-page="analytics">📈 Analytics</a>
        <a href="#reports" class="admin-nav-item" data-page="reports">📄 Reports</a>
        <a href="#revenue" class="admin-nav-item" data-page="revenue">💰 Revenue</a>
        <a href="#ai-config" class="admin-nav-item" data-page="ai-config">🤖 AI Config</a>
        <a href="#backup" class="admin-nav-item" data-page="backup">💾 Backup</a>
        <a href="#logs" class="admin-nav-item" data-page="logs">📋 Logs</a>
        <a href="#settings-admin" class="admin-nav-item" data-page="settings-admin">⚙️ Settings</a>
        <a href="#cloud-config" class="admin-nav-item" data-page="cloud-config">☁️ Cloud Config</a>
        <a href="#push-notifications" class="admin-nav-item" data-page="push-notifications">📲 Push</a>
      </nav>

      <!-- Main Content -->
      <main class="admin-main" id="admin-main-content">
        <!-- Pages injected here by JS -->
      </main>
    </div>
  </div>

    <script src="services/repository.js"></script>
  <script src="services/sync-service.js"></script>
  <script src="services/auth-service.js"></script>
  <script src="services/premium-service.js"></script>
  <script src="services/ai-provider.js"></script>
  <script src="services/error-service.js"></script>
  <script src="services/migration-service.js"></script>
  <script src="services/backup-engine.js"></script>
  <script src="services/firebase-service.js"></script>
  <script src="services/cloud-sync.js"></script>
  <script src="services/notification-service.js"></script>
  <script src="services/analytics-service.js"></script>
  <script src="services/remote-config-service.js"></script>
  <script src="services/security-service.js"></script>
  <script src="services/performance-service.js"></script>
  <script src="config-service.js"></script>
  <script src="admin.js" defer></script>
</body>
</html>
